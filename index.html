<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AFL Mobile</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws: wss: https:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="style.css?v=34">
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="clubcv" class="hide"></canvas>

<div id="menu"><div id="stage"></div></div>

<div id="hud" class="hide">
  <div id="score">
    <div class="team home"><b>HOME</b><span id="hs">0.0 (0)</span></div>
    <div id="clock"><span id="qtr">Q1</span><span id="time">1:30</span><span id="diffTag">NORMAL</span></div>
    <div class="team away"><span id="as">0.0 (0)</span><b>AWAY</b></div>
  </div>
  <div id="who"><div id="whoName">-</div><div class="bar"><i id="stam"></i></div><div class="bar kick"><i id="kick"></i></div><div id="rng"></div></div>
  <div id="banner"></div>
  <div id="ballup" class="hide"><div class="bu-t">BALL UP</div><div class="bu-n" id="buName"></div><div class="bu-bar"><i id="buZone"></i><b id="buMark"></b></div><div class="bu-h">Press <span id="buKey">SPACE</span> (or click) when the marker is in the green zone</div></div>
  <div id="hint">WASD move · Shift sprint · Space kick · Mark or win a free for a set shot · F handpass · T tackle · Esc pause</div>
  <div id="popups"></div>
  <div id="chud" class="hide"></div>
  <div id="drill" class="hide">
    <div id="drTop"><b id="drTitle">DRILL</b><span id="drCount"></span></div>
    <div id="drSub"></div>
    <div id="drBar"><i id="drFill"></i><b id="drMark"></b></div>
    <div id="drBtns"></div>
    <div id="drHint"></div>
  </div>
</div>

<div id="setshot" class="hide">
  <div id="ssCross"></div>
  <div id="ssPanel">
    <div id="ssTitle">SET SHOT</div>
    <div id="ssAim">CENTRE</div>
    <div id="ssBar"><i id="ssTick"></i><b id="ssPow"></b></div>
    <div id="ssHint">A / D aim · Hold to set power · Release to kick</div>
  </div>
  <div id="ssBtns">
    <button type="button" id="ssLeft">AIM LEFT</button>
    <button type="button" id="ssKick">HOLD TO KICK</button>
    <button type="button" id="ssRight">AIM RIGHT</button>
  </div>
</div>

<div id="overlay" class="hide"></div>

<script src="vendor/three.min.js"></script>
<script src="sim.js?v=33"></script>
<script src="game.js?v=33"></script>
<script src="config.js?v=1"></script>
<script src="net.js?v=34"></script>
<script src="mpmarket.js?v=34"></script>
<script src="hacks.js?v=14"></script>
</body>
</html>
